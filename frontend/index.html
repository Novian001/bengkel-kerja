<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>BengkelKerja — papan work order</title>
  <!-- WHY no webfont <link>: the shop counter runs on a VPS with no outbound network, and a
       blocking font request would delay the board. System stack + tabular numerals instead. -->
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2317140f'/><path d='M9 22V10h13M9 16h9' stroke='%23f0a028' stroke-width='3' fill='none'/></svg>">
</head>
<body>
  <a class="skip-link" href="#panel">Langsung ke konten</a>

  <header class="topbar">
    <div class="topbar-left">
      <h1 class="brand">
        <span class="brand-mark" aria-hidden="true">BK</span>
        <span class="brand-text">Bengkel<span class="brand-alt">Kerja</span></span>
      </h1>
      <p class="brand-sub">Counter service &amp; authorisation</p>
    </div>
    <div id="role-switcher" class="role-switcher-host"></div>
  </header>

  <nav id="tabs" class="tabs-host" aria-label="Layar bengkel"></nav>

  <main id="panel" class="panel-host" data-tab="board" tabindex="-1">
    <div id="global-error" class="global-error" role="alert"></div>
    <div id="board-root" class="screen"></div>
    <div id="stock-root" class="screen" hidden></div>
    <div id="bays-root" class="screen" hidden></div>
    <div id="reports-root" class="screen" hidden></div>
  </main>

  <div id="invoice-host" class="invoice-host" hidden></div>

  <noscript>
    <p class="noscript">Aplikasi ini butuh JavaScript. Data tetap tersedia lewat API:
      <code>GET /api/board</code>, <code>GET /api/jobs</code>, <code>GET /api/reports/daily</code>.</p>
  </noscript>

  <script type="module" src="/js/app.mjs"></script>
</body>
</html>
